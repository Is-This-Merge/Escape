<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 로그인</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/staff.css">
  <script src="js/theme.js"></script>
</head>
<body class="staff-page">
  <a class="corner-home" href="index.html" aria-label="홈 화면으로 돌아가기">⌂</a>
  <main class="staff-panel">
    <h1>직원 로그인</h1>
    <p id="staff-status" role="status">로그인 상태 확인 중…</p>
    <form id="staff-form">
      <label for="staff-email">이메일</label>
      <input id="staff-email" type="email" autocomplete="username" required>
      <label for="staff-password">비밀번호</label>
      <input id="staff-password" type="password" autocomplete="current-password" required>
      <button id="staff-signin" type="submit">로그인</button>
    </form>
    <div id="staff-actions" hidden>
      <a id="staff-continue" href="index.html">홈으로 돌아가기</a>
      <button id="staff-signout" type="button">이 패드에서 로그아웃</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
