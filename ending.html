<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Escape</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ending.css">
  <link rel="stylesheet" href="./css/themes.css">
    <link rel="stylesheet" href="./css/screen.css">
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <script src="js/theme.js"></script>
</head>
<body class="has-corner-home ending-page">
<a class="corner-home" href="index.html" aria-label="홈 화면으로 돌아가기" title="홈 화면으로 돌아가기">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" /></svg>
</a>
<div class="container">
  <div class="background-overlay"></div>
  <div class="header" id="title" data-concept-title>The Escape</div>
  <p class="concept-subtitle" data-concept-subtitle></p>
  <div class="content">
    <dialog id="record-dialog" aria-labelledby="record-title" aria-describedby="completion-message">
    <form class="input-card" id="record-form" hidden>
      <h2 id="record-title">탈출 기록</h2>
      <p id="completion-message" role="status"></p>
      <div class="field">
        <label class="field-label" for="inp-nick">닉네임</label>
        <input class="field-input" id="inp-nick" type="text" placeholder="예: 탈출왕" maxlength="12" required autofocus>
      </div>
      <div class="field">
        <span class="field-label">최종 기록 시간</span>
        <div class="result-time" id="result-time">--:--</div>
        <p class="time-hint" id="penalty-note">힌트 사용 시 문제당 10분이 포함됩니다.</p>
      </div>
      <button class="btn-add" id="save-record" type="submit">기록 등록</button>
      <p id="record-error" role="alert"></p>
    </form>
    </dialog>
    <section class="records-container" id="leaderboard" aria-labelledby="leaderboard-title" hidden>
      <div class="sec-label">
        <h2 id="leaderboard-title">리더보드</h2>
        <span id="rec-count">0명</span>
      </div>
      <div class="records" id="records-list" aria-live="polite"></div>
      <div class="board-feedback"><p id="board-status" role="status"></p><button type="button" id="board-retry" hidden>다시 시도</button></div>
      <nav class="record-pagination" aria-label="순위표 페이지">
        <button type="button" id="records-prev" aria-label="이전 순위 페이지">이전</button>
        <span id="records-page" aria-live="polite">1 / 1</span>
        <button type="button" id="records-next" aria-label="다음 순위 페이지">다음</button>
      </nav>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
